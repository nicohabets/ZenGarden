name = "zengarden"
workers_dev = true
preview_urls = true
compatibility_date = "2026-08-23"

# Workers Static Assets — no Worker script, no Pages project flag.
# Service name matches the existing Cloudflare Workers Builds project (`zengarden`).
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[build]
command = "npm run build"
